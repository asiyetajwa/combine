<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1290" viewBox="0 0 1600 1290" role="img" aria-labelledby="title desc">
<title id="title">Combine — proposed EDA flow</title>
<desc id="desc">A proposed future digital-chip development flow. Read stages one to four left to right, then five to eight right to left. Requirements, RTL, verification, power exploration, synthesis and test, physical implementation, signoff, and silicon validation. No production EDA flow or tape-out is claimed.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="none" stroke="#476950" stroke-width="1.6"/></marker></defs>
<style>text{font-family:Arial,sans-serif;fill:#173d32}.muted{fill:#566554}.eyebrow{font-size:17px;letter-spacing:1.8px;font-weight:700}.body{font-size:20px}.tool{font-size:17px;font-weight:700}.caption{font-size:17px;fill:#566554}.arrow{fill:none;stroke:#476950;stroke-width:2.4;marker-end:url(#arrow)}</style>
<rect width="1600" height="1290" fill="#f7f8f2"/>
<text x="70" y="64" font-size="26" font-weight="700">Combine<tspan font-size="19" font-weight="400">, A Circle+ Company</tspan></text>
<rect x="1180" y="34" width="350" height="40" rx="20" fill="#e6ebd8"/>
<text x="1355" y="60" text-anchor="middle" class="eyebrow">PROPOSED / SEPTEMBER 2026</text>
<text x="70" y="144" font-size="57" font-weight="700">From energy budget to silicon.</text>
<text x="70" y="188" font-size="24" class="muted">Future digital-chip R&amp;D flow for solar-assisted AI compute. Architecture and process node are not yet selected.</text>
<rect x="70" y="224" width="1460" height="69" rx="12" fill="#e6ebd8"/>
<text x="92" y="252" class="tool">STARTING POINT</text>
<text x="92" y="278" class="body">Small LLM labs on existing accelerators. Validate a useful workload before choosing a custom-silicon block.</text>
<text x="70" y="331" class="eyebrow">A / PROPOSED INITIAL EDA EVALUATION</text>
<rect x="70" y="356" width="320" height="324" rx="18" fill="#fff" stroke="#ccd5c4"/><circle cx="101" cy="390" r="17" fill="#e6ebd8"/><text x="101" y="396" text-anchor="middle" font-size="17" font-weight="700">01</text><text x="93" y="439" font-size="24" font-weight="700">Workload &amp;</text><text x="93" y="466" font-size="24" font-weight="700">architecture</text><text x="93" y="500" class="body">Select a compute / control block.</text><text x="93" y="526" class="body">Set energy, latency, memory</text><text x="93" y="552" class="body">and accuracy targets from a</text><text x="93" y="578" class="body">measured system baseline.</text><line x1="93" x2="367" y1="594" y2="594" stroke="#dfe4d8"/><text x="93" y="619" class="tool">System models + workload traces</text><text x="230" y="704" text-anchor="middle" class="caption">Requirements + reference model</text><rect x="450" y="356" width="320" height="324" rx="18" fill="#fff" stroke="#ccd5c4"/><circle cx="481" cy="390" r="17" fill="#e6ebd8"/><text x="481" y="396" text-anchor="middle" font-size="17" font-weight="700">02</text><text x="473" y="439" font-size="24" font-weight="700">RTL &amp; power intent</text><text x="473" y="500" class="body">Develop digital RTL, interfaces</text><text x="473" y="526" class="body">and a testbench. Define clocks,</text><text x="473" y="552" class="body">resets and UPF power states;</text><text x="473" y="578" class="body">plan testability from the start.</text><line x1="473" x2="747" y1="594" y2="594" stroke="#dfe4d8"/><text x="473" y="619" class="tool">VC SpyGlass: lint / CDC / RDC</text><text x="610" y="704" text-anchor="middle" class="caption">RTL + UPF + timing constraints</text><rect x="830" y="356" width="320" height="324" rx="18" fill="#fff" stroke="#ccd5c4"/><circle cx="861" cy="390" r="17" fill="#e6ebd8"/><text x="861" y="396" text-anchor="middle" font-size="17" font-weight="700">03</text><text x="853" y="439" font-size="24" font-weight="700">Functional</text><text x="853" y="466" font-size="24" font-weight="700">verification</text><text x="853" y="500" class="body">Compare against the reference.</text><text x="853" y="526" class="body">Exercise normal operation,</text><text x="853" y="552" class="body">power transitions and recovery.</text><text x="853" y="578" class="body">Track coverage and assertions.</text><line x1="853" x2="1127" y1="594" y2="594" stroke="#dfe4d8"/><text x="853" y="619" class="tool">VCS / Verdi / VC LP</text><text x="853" y="642" class="tool">VC Formal, where needed</text><text x="990" y="704" text-anchor="middle" class="caption">Verified RTL + activity traces</text><rect x="1210" y="356" width="320" height="324" rx="18" fill="#fff" stroke="#ccd5c4"/><circle cx="1241" cy="390" r="17" fill="#e6ebd8"/><text x="1241" y="396" text-anchor="middle" font-size="17" font-weight="700">04</text><text x="1233" y="439" font-size="24" font-weight="700">Power / performance</text><text x="1233" y="466" font-size="24" font-weight="700">/ area</text><text x="1233" y="500" class="body">Use representative activity to</text><text x="1233" y="526" class="body">compare architectures, memory</text><text x="1233" y="552" class="body">traffic, clock gating and</text><text x="1233" y="578" class="body">sleep / wake-up overhead.</text><line x1="1233" x2="1507" y1="594" y2="594" stroke="#dfe4d8"/><text x="1233" y="619" class="tool">RTL Architect / PrimePower RTL</text><text x="1370" y="704" text-anchor="middle" class="caption">PPA evidence + go / no-go</text><rect x="1210" y="765" width="320" height="324" rx="18" fill="#fff" stroke="#ccd5c4"/><circle cx="1241" cy="799" r="17" fill="#e6ebd8"/><text x="1241" y="805" text-anchor="middle" font-size="17" font-weight="700">05</text><text x="1233" y="848" font-size="24" font-weight="700">Synthesis &amp;</text><text x="1233" y="875" font-size="24" font-weight="700">design for test</text><text x="1233" y="909" class="body">Map RTL to the selected library.</text><text x="1233" y="935" class="body">Insert scan / test structures;</text><text x="1233" y="961" class="body">check equivalence and power</text><text x="1233" y="987" class="body">intent after transformation.</text><line x1="1233" x2="1507" y1="1003" y2="1003" stroke="#dfe4d8"/><text x="1233" y="1028" class="tool">Fusion Compiler / TestMAX DFT</text><text x="1233" y="1051" class="tool">Formality / VC LP</text><text x="1370" y="1113" text-anchor="middle" class="caption">Mapped, testable netlist</text><rect x="830" y="765" width="320" height="324" rx="18" fill="#fff" stroke="#ccd5c4"/><circle cx="861" cy="799" r="17" fill="#e6ebd8"/><text x="861" y="805" text-anchor="middle" font-size="17" font-weight="700">06</text><text x="853" y="848" font-size="24" font-weight="700">Physical</text><text x="853" y="875" font-size="24" font-weight="700">implementation</text><text x="853" y="909" class="body">Floorplan and plan power.</text><text x="853" y="935" class="body">Place cells, build clock trees</text><text x="853" y="961" class="body">and route interconnect.</text><text x="853" y="987" class="body">Iterate timing and congestion.</text><line x1="853" x2="1127" y1="1003" y2="1003" stroke="#dfe4d8"/><text x="853" y="1028" class="tool">Fusion Compiler</text><text x="990" y="1113" text-anchor="middle" class="caption">Routed design + updated netlist</text><rect x="450" y="765" width="320" height="324" rx="18" fill="#fff" stroke="#ccd5c4"/><circle cx="481" cy="799" r="17" fill="#e6ebd8"/><text x="481" y="805" text-anchor="middle" font-size="17" font-weight="700">07</text><text x="473" y="848" font-size="24" font-weight="700">Signoff &amp; test patterns</text><text x="473" y="909" class="body">Check parasitics, timing, power,</text><text x="473" y="935" class="body">DRC / LVS and EM / IR integrity.</text><text x="473" y="961" class="body">Close test coverage and</text><text x="473" y="987" class="body">rerun equivalence / power checks.</text><line x1="473" x2="747" y1="1003" y2="1003" stroke="#dfe4d8"/><text x="473" y="1028" class="tool">PrimeTime / StarRC / PrimePower</text><text x="473" y="1051" class="tool">IC Validator / RedHawk-SC</text><text x="473" y="1074" class="tool">TestMAX ATPG</text><text x="610" y="1113" text-anchor="middle" class="caption">Foundry-ready data, if all pass</text><rect x="70" y="765" width="320" height="324" rx="18" fill="#fff" stroke="#ccd5c4"/><circle cx="101" cy="799" r="17" fill="#e6ebd8"/><text x="101" y="805" text-anchor="middle" font-size="17" font-weight="700">08</text><text x="93" y="848" font-size="24" font-weight="700">Tape-out &amp;</text><text x="93" y="875" font-size="24" font-weight="700">silicon validation</text><text x="93" y="909" class="body">Review release, fabricate,</text><text x="93" y="935" class="body">package and test. Bring up on</text><text x="93" y="961" class="body">a board; measure functionality,</text><text x="93" y="987" class="body">energy and workload quality.</text><line x1="93" x2="367" y1="1003" y2="1003" stroke="#dfe4d8"/><text x="93" y="1028" class="tool">Foundry + package / test partners</text><text x="93" y="1051" class="tool">Lab instruments + software</text><text x="230" y="1113" text-anchor="middle" class="caption">Measured silicon vs. baseline</text><path class="arrow" d="M398 515 H438"/><path class="arrow" d="M778 515 H818"/><path class="arrow" d="M1158 515 H1198"/><path class="arrow" d="M1202 924 H1162"/><path class="arrow" d="M822 924 H782"/><path class="arrow" d="M442 924 H402"/><path class="arrow" d="M1370 715 V752"/>
<text x="70" y="740" class="eyebrow">B / IMPLEMENTATION ONLY AFTER FEASIBILITY, FUNDING &amp; FOUNDRY ENABLEMENT</text>
<rect x="70" y="1140" width="1460" height="65" rx="12" fill="#173d32"/>
<text x="92" y="1167" style="fill:#f7f8f2" class="tool">ITERATE THROUGHOUT</text>
<text x="92" y="1192" style="fill:#f7f8f2" class="body">Verification, UPF, equivalence and PPA checks repeat after changes; failed checks return to the relevant design stage.</text>
<text x="70" y="1239" font-size="18" class="muted">Dependencies: foundry PDK, cell / SRAM / I/O libraries, IP rights, extraction and signoff decks, packaging and test access.</text>
<text x="70" y="1269" font-size="18" class="muted">Solar generation, battery storage and power conversion remain external to the digital die. All tools shown are prospective.</text>
</svg>